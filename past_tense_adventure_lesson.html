    <script>
        /* Web Audio API Sound Synthesizer (No external audio files needed!) */
        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // SFX Generator
        function playSFX(type) {
            try {
                initAudio();
                const now = audioCtx.currentTime;

                if (type === 'correct') {
                    // Cheerful arpeggio C5 - E5 - G5 - C6
                    const freqs = [523.25, 659.25, 783.99, 1046.50];
                    freqs.forEach((f, index) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, now + index * 0.08);
                        gain.gain.setValueAtTime(0.15, now + index * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.25);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + index * 0.08);
                        osc.stop(now + index * 0.08 + 0.25);
                    });
                } else if (type === 'wrong') {
                    // Soft error low buzz
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.setValueAtTime(130, now + 0.1);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'click') {
                    // Crisp click
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'victory') {
                    // Victory fanfare sequence
                    const notes = [523.25, 659.25, 783.99, 1046.50, 880, 1046.50];
                    const times = [0, 0.12, 0.24, 0.36, 0.52, 0.70];
                    notes.forEach((f, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, now + times[i]);
                        gain.gain.setValueAtTime(0.2, now + times[i]);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + times[i] + 0.3);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + times[i]);
                        osc.stop(now + times[i] + 0.3);
                    });
                }
            } catch(e) {
                console.log("Audio API standard init", e);
            }
        }

        // Cheerful Procedural Background Music
        function toggleBGM() {
            initAudio();
            isBgmPlaying = !isBgmPlaying;
            
            const btnIcon = document.getElementById('bgm-icon');
            const btnText = document.getElementById('bgm-text');

            if (isBgmPlaying) {
                btnIcon.className = 'fa-solid fa-volume-high text-emerald-600 animate-bounce';
                btnText.textContent = 'Music: ON';
                startBgmLoop();
            } else {
                btnIcon.className = 'fa-solid fa-music text-slate-500';
                btnText.textContent = 'Music: OFF';
                stopBgmLoop();
            }
        }

        function startBgmLoop() {
            if (bgmInterval) clearInterval(bgmInterval);
            
            // Soft Pentatonic Melody Loop (C major pentatonic)
            const melody = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 392.00, 329.63];
            let noteIdx = 0;

            bgmInterval = setInterval(() => {
                if (!isBgmPlaying || !audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(melody[noteIdx], now);
                
                // Very soft ambient volume
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.38);

                noteIdx = (noteIdx + 1) % melody.length;
            }, 400);
        }

        function stopBgmLoop() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }
    </script>

    <script>
        // Global Application State
        let currentStep = 0;
        let starScore = 0;

        // Custom Feedback Modal Helper
        function showFeedbackModal(isSuccess, title, message, onConfirm = null) {
            playSFX(isSuccess ? 'correct' : 'wrong');
            
            const modal = document.createElement('div');
            modal.id = 'feedback-modal';
            modal.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in';
            
            modal.innerHTML = `
                <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center border-4 ${isSuccess ? 'border-emerald-400' : 'border-rose-400'} shadow-2xl transform transition-all scale-100">
                    <div class="w-20 h-20 mx-auto mb-4 rounded-full flex items-center justify-center ${isSuccess ? 'bg-emerald-100 text-emerald-500' : 'bg-rose-100 text-rose-500'} text-4xl shadow-inner">
                        <i class="fa-solid ${isSuccess ? 'fa-face-laugh-beam animate-bounce' : 'fa-face-frown'}"></i>
                    </div>
                    <h3 class="text-2xl font-extrabold ${isSuccess ? 'text-emerald-600' : 'text-rose-600'} mb-2">${title}</h3>
                    <p class="text-slate-600 font-medium mb-6 text-base">${message}</p>
                    <button id="modal-btn" class="w-full ${isSuccess ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-amber-500 hover:bg-amber-600'} text-white font-extrabold py-3 rounded-2xl shadow-lg transition active:scale-95 text-lg">
                        ${isSuccess ? 'CONTINUE 🌟' : 'TRY AGAIN 💪'}
                    </button>
                </div>
            `;

            document.body.appendChild(modal);

            document.getElementById('modal-btn').onclick = () => {
                document.body.removeChild(modal);
                if (onConfirm) onConfirm();
            };
        }

        function addStar(count = 1) {
            starScore += count;
            document.getElementById('star-count').textContent = starScore;
            
            // Pop effect on star counter
            const starEl = document.getElementById('star-count').parentElement;
            starEl.classList.add('scale-125', 'bg-amber-200');
            setTimeout(() => {
                starEl.classList.remove('scale-125', 'bg-amber-200');
            }, 300);
        }

        // Navigation Controllers
        function updateProgressUI() {
            const totalSteps = 13;
            const progressPercent = ((currentStep + 1) / totalSteps) * 100;
            document.getElementById('top-progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('current-step-label').textContent = `Step ${currentStep + 1} of ${totalSteps}`;

            // Button visibility state
            const prevBtn = document.getElementById('btn-prev');
            const nextBtn = document.getElementById('btn-next');

            prevBtn.disabled = currentStep === 0;

            if (currentStep === 0) {
                nextBtn.classList.add('hidden');
            } else if (currentStep === 12) {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }

            // Render current step content
            renderStepContent(currentStep);
        }

        function nextStep() {
            playSFX('click');
            if (currentStep < 12) {
                currentStep++;
                updateProgressUI();
            }
        }

        function prevStep() {
            playSFX('click');
            if (currentStep > 0) {
                currentStep--;
                updateProgressUI();
            }
        }

        function renderStepContent(stepIndex) {
            const viewport = document.getElementById('app-viewport');
            const mascotTip = document.getElementById('mascot-tip-text');

            switch(stepIndex) {
                case 0:
                    renderWelcomeScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Welcome! Tap START to begin our adventure!";
                    break;
                case 1:
                    renderObjectivesScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Here is what we will learn today!";
                    break;
                case 2:
                    renderWarmUpScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Let's compare Yesterday and Today!";
                    break;
                case 3:
                    renderWhatIsPastTenseScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Past tense tells us about what already happened!";
                    break;
                case 4:
                    renderRegularVerbsScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Adding -ed makes many words past tense!";
                    break;
                case 5:
                    renderSpellingRulesScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Watch out for special spelling rules!";
                    break;
                case 6:
                    renderIrregularVerbsScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Memory Game! Find matching past tense pairs!";
                    break;
                case 7:
                    renderChooseVerbScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Choose the correct past tense verb!";
                    break;
                case 8:
                    renderChangeSentenceScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Change present sentences into past tense!";
                    break;
                case 9:
                    renderDetectiveScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Spot the past tense verb in each sentence!";
                    break;
                case 10:
                    renderMiniStoryScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Read the fun story and answer the questions!";
                    break;
                case 11:
                    renderFinalChallengeScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Show off your knowledge in the Final Quiz!";
                    break;
                case 12:
                    renderExitTicketScreen(viewport);
                    if(mascotTip) mascotTip.textContent = "Congratulations! Claim your certificate!";
                    break;
            }
        }

                    <div class="bg-slate-900 text-white p-5 rounded-3xl text-center space-y-2 shadow-xl border-2 border-amber-400">
                        <div class="text-4xl">🕵️‍♂️🔎</div>
                        <p class="text-amber-300 font-extrabold text-sm uppercase">Find the Past Tense Verb!</p>
                        <p class="text-2xl font-black text-white py-1">"${dq.sentence}"</p>
                    </div>

                    <p class="text-center font-bold text-slate-700">Which word is the <span class="text-amber-600 underline font-black">past tense verb</span>?</p>

                    <!-- Choice Buttons -->
                    <div class="grid grid-cols-3 gap-3">
                        ${dq.words.map(w => `
                            <button onclick="checkDetectiveWord('${w}')" class="bg-amber-100 hover:bg-amber-200 border-2 border-amber-300 text-amber-900 font-black py-4 px-2 rounded-2xl text-xl shadow-md transition active:scale-95">
                                ${w}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function checkDetectiveWord(selected) {
            const currentDQ = detectiveQuestions[detectiveIdx];
            if (selected === currentDQ.verb) {
                addStar(1);
                showFeedbackModal(true, "Case Solved! 🔎", `"${selected}" is indeed the past tense verb!`, () => {
                    if (detectiveIdx < detectiveQuestions.length - 1) {
                        detectiveIdx++;
                        renderDetectiveQuestion(document.getElementById('app-viewport'));
                    } else {
                        showFeedbackModal(true, "Master Detective! 🏆", "You solved all detective cases!", () => {
                            nextStep();
                        });
                    }
                });
            } else {
                showFeedbackModal(false, "Keep Searching! 🕵️", `"${selected}" is not the action verb. Try again!`);
            }
        }

        let storyQuestionIdx = 0;
        const storyQuestions = [
            { q: "Where did Maria go yesterday?", options: ["To the park", "To the zoo", "To school"], ans: "To the park" },
            { q: "What did she see?", options: ["A small cat", "A big dog", "A bird"], ans: "A big dog" },
            { q: "What did they eat at the park?", options: ["Apples", "Ice cream", "Sandwiches"], ans: "Sandwiches" }
        ];

        function renderMiniStoryScreen(container) {
            storyQuestionIdx = 0;
            container.innerHTML = `
                <div class="space-y-5 animate-fade-in">
                    <div class="text-center space-y-1">
                        <span class="bg-rose-100 text-rose-800 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Story Time</span>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800">Yesterday at the Park 📖</h2>
                    </div>

                    <!-- Story Box with Highlighted Verbs -->
                    <div class="bg-amber-50 border-2 border-amber-300 p-5 rounded-3xl space-y-2 text-slate-800 font-bold text-base sm:text-lg leading-relaxed shadow-sm">
                        <p>Yesterday, Maria <span class="bg-amber-300 px-2 py-0.5 rounded-lg text-slate-900 font-black">went</span> to the park.</p>
                        <p>She <span class="bg-amber-300 px-2 py-0.5 rounded-lg text-slate-900 font-black">saw</span> a big dog.</p>
                        <p>She <span class="bg-amber-300 px-2 py-0.5 rounded-lg text-slate-900 font-black">played</span> with her friends.</p>
                        <p>They <span class="bg-amber-300 px-2 py-0.5 rounded-lg text-slate-900 font-black">ate</span> some sandwiches.</p>
                        <p>Then they <span class="bg-amber-300 px-2 py-0.5 rounded-lg text-slate-900 font-black">ran</span> home.</p>
                    </div>

                    <!-- Interactive Story Comprehension -->
                    <div id="story-quiz-area" class="bg-white border-2 border-slate-200 p-4 rounded-3xl space-y-3 shadow-sm">
                        <!-- Dynamic Question -->
                    </div>
                </div>
            `;

            renderStoryQuestion();
        }

        function renderStoryQuestion() {
            const sq = storyQuestions[storyQuestionIdx];
            const quizArea = document.getElementById('story-quiz-area');
            if(!quizArea) return;

            quizArea.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-xs font-black text-rose-600 uppercase">Question ${storyQuestionIdx + 1} of 3</span>
                </div>
                <p class="font-extrabold text-slate-800 text-lg text-center font-bold">${sq.q}</p>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    ${sq.options.map(opt => `
                        <button onclick="checkStoryAnswer('${opt}')" class="bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-900 font-extrabold p-3 rounded-2xl text-base transition active:scale-95">
                            ${opt}
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function checkStoryAnswer(selected) {
            const currentSQ = storyQuestions[storyQuestionIdx];
            if (selected === currentSQ.ans) {
                addStar(1);
                showFeedbackModal(true, "Correct! 📖", `"${selected}" is the right answer based on the story!`, () => {
                    if (storyQuestionIdx < storyQuestions.length - 1) {
                        storyQuestionIdx++;
                        renderStoryQuestion();
                    } else {
                        showFeedbackModal(true, "Story Completed! 🌟", "Great reading comprehension skills!", () => {
                            nextStep();
                        });
                    }
                });
            } else {
                showFeedbackModal(false, "Check the Story! 🧐", "Read the sentence highlighted above and try again!");
            }
        }

        let finalQuizIdx = 0;
        let finalQuizScore = 0;
        let finalQuizQuestionStarred = [];

        const finalQuizData = [
            { q: "1. Yesterday, Ali _____ a fast dog.", options: ["sees", "saw", "seeing"], ans: "saw", hint: "'Yesterday' tells us this happened before. The past tense of 'see' is 'saw'!" },
            { q: "2. We _____ football last night.", options: ["played", "play", "playing"], ans: "played", hint: "Add -ed to 'play' for actions that happened in the past!" },
            { q: "3. Mother _____ a cake yesterday.", options: ["baked", "bake", "baking"], ans: "baked", hint: "'bake' ends in 'e', so just add 'd' at the end!" },
            { q: "4. What is the past tense of 'GO'?", options: ["goed", "went", "going"], ans: "went", hint: "'GO' is an irregular verb! It changes completely to 'went'!" },
            { q: "5. What is the past tense of 'EAT'?", options: ["eated", "ate", "eating"], ans: "ate", hint: "'EAT' is an irregular verb! It changes to 'ate'!" },
            { q: "6. 'She danced gracefully.' - Which is the past verb?", options: ["She", "danced", "gracefully"], ans: "danced", hint: "'danced' is the action word ending in -ed!" },
            { q: "7. Change to past: 'I walk home.'", options: ["I walked home.", "I walking home.", "I walks home."], ans: "I walked home.", hint: "Change the verb 'walk' to 'walked'!" },
            { q: "8. Change to past: 'They buy food.'", options: ["They buyed food.", "They bought food.", "They buying food."], ans: "They bought food.", hint: "'buy' is an irregular verb that becomes 'bought'!" },
            { q: "9. What is the past tense of 'STUDY'?", options: ["studied", "studyed", "studying"], ans: "studied", hint: "For words ending in consonant + y, change 'y' to '-ied'!" },
            { q: "10. Yesterday, Maria _____ to the park.", options: ["go", "went", "goes"], ans: "went", hint: "The past tense of 'go' is 'went'!" }
        ];

        function renderFinalChallengeScreen(container) {
            finalQuizIdx = 0;
            finalQuizScore = 0;
            finalQuizQuestionStarred = new Array(finalQuizData.length).fill(false);
            renderFinalQuizQuestion(container);
        }

        function renderFinalQuizQuestion(container) {
            const fq = finalQuizData[finalQuizIdx];
            container.innerHTML = `
                <div class="space-y-6 animate-fade-in">
                    <div class="flex items-center justify-between">
                        <span class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-xs font-bold uppercase">Final Challenge ${finalQuizIdx + 1} / 10</span>
                        <span class="text-xs font-extrabold text-amber-600">Score: ${finalQuizScore} / 10</span>
                    </div>

                    <!-- Question Container -->
                    <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-6 rounded-3xl text-center shadow-xl space-y-2">
                        <span class="text-amber-300 font-extrabold text-xs uppercase tracking-widest">Question ${finalQuizIdx + 1}</span>
                        <h3 class="text-2xl font-black">${fq.q}</h3>
                    </div>

                    <!-- Answers Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        ${fq.options.map(opt => `
                            <button onclick="submitFinalQuizChoice('${opt.replace(/'/g, "\\'")}')" class="bg-white hover:bg-purple-50 border-2 border-slate-200 hover:border-purple-400 font-black text-slate-800 py-4 px-3 rounded-2xl text-lg shadow-sm transition active:scale-95">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function submitFinalQuizChoice(selected) {
            const currentFQ = finalQuizData[finalQuizIdx];
            if (selected === currentFQ.ans) {
                if (!finalQuizQuestionStarred[finalQuizIdx]) {
                    finalQuizQuestionStarred[finalQuizIdx] = true;
                    finalQuizScore++;
                    addStar(1);
                }

                showFeedbackModal(true, "Superb! 🌟", `"${selected}" is the correct past tense answer!`, () => {
                    if (finalQuizIdx < finalQuizData.length - 1) {
                        finalQuizIdx++;
                        renderFinalQuizQuestion(document.getElementById('app-viewport'));
                    } else {
                        showFinalResults();
                    }
                });
            } else {
                showFeedbackModal(false, "Try Again! 💪", currentFQ.hint);
            }
        }

        function showFinalResults() {
            playSFX('victory');
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

            let title = "";
            let badge = "";
            
            if (finalQuizScore >= 9) {
                title = "Past Tense Master! 🏆";
                badge = "🥇 PERFECT SCORE!";
            } else if (finalQuizScore >= 7) {
                title = "Excellent! 🌟";
                badge = "🥈 GREAT JOB!";
            } else if (finalQuizScore >= 5) {
                title = "Good Job! 👍";
                badge = "🥉 KEEP GOING!";
            } else {
                title = "Keep Practising! 💪";
                badge = "📚 ALMOST THERE!";
            }

            const viewport = document.getElementById('app-viewport');
            viewport.innerHTML = `
                <div class="text-center space-y-6 py-4 animate-fade-in">
                    <div class="inline-block bg-amber-100 border-2 border-amber-300 text-amber-800 px-4 py-1 rounded-full text-xs font-extrabold uppercase">
                        ${badge}
                    </div>

                    <h2 class="text-3xl sm:text-4xl font-black text-slate-800">${title}</h2>

                    <div class="w-32 h-32 mx-auto bg-amber-100 rounded-full border-4 border-amber-400 flex items-center justify-center text-4xl font-black text-amber-800 shadow-inner">
                        ${finalQuizScore} / 10
                    </div>

                    <p class="text-slate-600 font-bold max-w-md mx-auto text-base">
                        You collected <strong>${starScore}</strong> stars throughout the lesson!
                    </p>

                    <button onclick="nextStep()" class="bg-adventure-green hover:bg-emerald-600 text-white font-extrabold text-xl px-8 py-3.5 rounded-2xl shadow-lg transition active:scale-95">
                        GO TO EXIT TICKET 🎟️
                    </button>
                </div>
            `;
        }

        let exitTicketIdx = 0;
        let exitTicketStarred = [];

        const exitTicketQuestions = [
            {
                q: "What do we use the Past Tense for?",
                options: [
                    "A. Things happening now",
                    "B. Things that already happened",
                    "C. Things that will happen"
                ],
                ans: "B. Things that already happened",
                hint: "Past tense tells us about actions that already took place in the past!"
            },
            {
                q: "Change the verb into the Past Tense: PLAY → ?",
                options: [
                    "A. played",
                    "B. playing",
                    "C. plays"
                ],
                ans: "A. played",
                hint: "For regular verbs like PLAY, add -ed to make it past tense!"
            },
            {
                q: "Change the verb into the Past Tense: GO → ?",
                options: [
                    "A. goed",
                    "B. went",
                    "C. going"
                ],
                ans: "B. went",
                hint: "GO is an irregular verb! It changes completely to WENT!"
            }
        ];

        function renderExitTicketScreen(container) {
            exitTicketIdx = 0;
            exitTicketStarred = new Array(exitTicketQuestions.length).fill(false);
            renderExitTicketQuestion(container);
        }

        function renderExitTicketQuestion(container) {
            if (exitTicketIdx >= exitTicketQuestions.length) {
                renderExitTicketCompletion(container);
                return;
            }

            const eq = exitTicketQuestions[exitTicketIdx];
            container.innerHTML = `
                <div class="space-y-6 animate-fade-in">
                    <div class="flex items-center justify-between">
                        <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold uppercase">Exit Ticket • Question ${exitTicketIdx + 1} of 3</span>
                        <span class="text-xs font-bold text-slate-400">Interactive Reflection</span>
                    </div>

                    <!-- Exit Question Box -->
                    <div class="bg-amber-50 border-2 border-amber-300 p-6 rounded-3xl text-center shadow-md space-y-2">
                        <span class="text-amber-800 font-black text-xs uppercase tracking-wider">Question ${exitTicketIdx + 1}</span>
                        <h3 class="text-2xl font-black text-slate-800">${eq.q}</h3>
                    </div>

                    <!-- Clickable Options -->
                    <div class="space-y-3">
                        ${eq.options.map(opt => `
                            <button onclick="handleExitTicketChoice('${opt.replace(/'/g, "\\'")}')" class="w-full bg-white hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-400 text-slate-800 font-black p-4 rounded-2xl text-lg text-left shadow-sm transition active:scale-95 flex items-center justify-between">
                                <span>${opt}</span>
                                <i class="fa-solid fa-circle-chevron-right text-slate-300"></i>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function handleExitTicketChoice(selected) {
            const eq = exitTicketQuestions[exitTicketIdx];
            if (selected === eq.ans) {
                if (!exitTicketStarred[exitTicketIdx]) {
                    exitTicketStarred[exitTicketIdx] = true;
                    addStar(1);
                }
                showFeedbackModal(true, "Correct! 🎉", "Great job answering the exit ticket question!", () => {
                    exitTicketIdx++;
                    renderExitTicketQuestion(document.getElementById('app-viewport'));
                });
            } else {
                showFeedbackModal(false, "Try Again! 💪", eq.hint);
            }
        }

        function renderExitTicketCompletion(container) {
            playSFX('victory');
            container.innerHTML = `
                <div class="space-y-6 animate-fade-in text-center py-2">
                    <div class="inline-block bg-amber-100 border-2 border-amber-300 text-amber-800 px-4 py-1 rounded-full text-xs font-black uppercase tracking-wider">
                        🎉 LESSON COMPLETE!
                    </div>

                    <div class="space-y-2">
                        <h2 class="text-3xl sm:text-4xl font-black text-slate-800">Fantastic Work! 🎉</h2>
                        <p class="text-xl sm:text-2xl font-black text-adventure-blue">You are now a PAST TENSE MASTER! 🏆</p>
                        <p class="text-base font-bold text-slate-500">Your lesson is complete!</p>
                    </div>

                    <!-- Stars Summary -->
                    <div class="bg-amber-50 border-2 border-amber-300 p-4 rounded-2xl max-w-xs mx-auto flex items-center justify-center gap-3 shadow-sm">
                        <span class="text-3xl">🌟</span>
                        <div>
                            <span class="block text-xs font-bold text-amber-800 uppercase">Total Stars Earned</span>
                            <span class="text-2xl font-black text-amber-900">${starScore} Stars</span>
                        </div>
                    </div>

                    <!-- Digital Badge / SK Puteri Certificate Frame -->
                    <div class="bg-white border-4 border-amber-400 p-6 rounded-3xl text-center space-y-3 shadow-xl relative overflow-hidden max-w-lg mx-auto">
                        <div class="absolute top-2 right-2 text-4xl opacity-20">🏆</div>
                        <span class="text-xs font-black text-slate-400 uppercase tracking-widest">Official Completion Certificate</span>
                        <h3 class="text-2xl font-black text-adventure-blue">PAST TENSE MASTER 🏆</h3>
                        <p class="text-sm font-bold text-slate-600">Awarded to Year 3 Pupil</p>

                        <div class="pt-3 border-t border-slate-200 flex items-center justify-between text-xs font-bold text-slate-500">
                            <span>SK Puteri • Year 3 English</span>
                            <span>By Teacher Maria A. Rachman</span>
                        </div>
                    </div>

                    <!-- Restart Button -->
                    <div class="pt-2">
                        <button onclick="restartLesson()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-black px-6 py-3 rounded-2xl transition active:scale-95 text-sm">
                            🔄 RESTART ADVENTURE
                        </button>
                    </div>
                </div>
            `;
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.5 } });
        }

        function restartLesson() {
            currentStep = 0;
            starScore = 0;
            document.getElementById('star-count').textContent = '0';
            updateProgressUI();
        }

        // Initialize application on page load
        window.onload = function() {
            updateProgressUI();
        };
    </script>
</body>
</html>
